[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "amora"
version = "0.1.0"
description = "Automated Microarchitecture Observation and Reverse-engineering for Accelerators"
requires-python = ">=3.10"
dependencies = []
license = {file = "LICENSE"}

[project.optional-dependencies]
test = ["pytest>=7"]
portable-core = ["numpy>=1.24"]

[project.scripts]
amora = "amora.cli:main"
amora-portable-core = "benchmark_generators.portable_core.__main__:main"

[tool.setuptools.packages.find]
include = ["amora*", "benchmark_generators*"]

[tool.setuptools.package-data]
"benchmark_generators.ppp_canonical" = ["templates/*.cu"]
"benchmark_generators.portable_core" = ["LICENSE.Apache-2.0", "NOTICE", "PROVENANCE.json", "SEMANTIC_FINGERPRINTS.json", "README.md"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "cuda: requires a CUDA-capable NVIDIA GPU",
  "ncu: requires Nsight Compute CLI",
  "nvbit: requires NVBit",
]
